<!DOCTYPE html>
<html>
<head>
    <title>JSON - Book Store Management</title>
</head>
<body>
    <script>
     
        let books = [
            { title: "JavaScript Basics", author: "Anu", price: 450, available: true },
            { title: "HTML & CSS", author: "Devi", price: 350, available: false }
        ];

        let output = "All Books:\n";

        
        for (let book of books) {
            output += `Title: ${book.title}, Author: ${book.author}, Price: ${book.price}, Available: ${book.available} ₹\n`;
        }

        output += "\nAvailable Books:\n";
        for (let book of books) {
            if (book.available) {
                output += `Title: ${book.title}, Author: ${book.author}, Price: ${book.price} ₹\n`;
            }
        }

       
        books.push({ title: "Node.js Guide", author: "Kumar", price: 600, available: true });
        output += "\nAfter Adding:\n";
        output += books.map(b => b.title).join(", ") + "\n";


        for (let book of books) {
            if (book.title === "JavaScript Basics") {
                book.price = 500;
            }
        }
        output += "\nAfter Price Update:\n";
        for (let book of books) {
            if (book.title === "JavaScript Basics") {
                output += `${book.title} - ${book.price} ₹\n`;
            }
        }

       
        books = books.filter(book => book.title !== "JavaScript Basics"); 
        output += "\nAfter Deletion:\n";
        output += books.map(b => b.title).join(", ");

        
        alert(output);
    </script>
</body>
</html>
