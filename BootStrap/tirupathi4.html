<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tirupati Temple Darshan Booking Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .temple-logo {
      width: 50px;
    }
  </style>
</head>
<body>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-lg rounded-4 p-4">
        <div class="text-center mb-4">
          <img src="temple.jpg" class="temple-logo mb-2" alt="Temple Logo">
          <h4 class="fw-bold">Tirupati Temple Darshan Booking Form</h4>
        </div>
        <form id="bookingForm" novalidate>

          <!-- Full Name -->
          <div class="mb-3 form-floating">
            <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
            <label for="fullName">Full Name</label>
            <div class="invalid-feedback">Please enter your full name.</div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required>
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <!-- Mobile -->
          <div class="mb-3">
            <label for="mobile" class="form-label">Mobile Number</label>
            <div class="input-group">
              <span class="input-group-text">+91</span>
              <input type="tel" class="form-control" id="mobile" pattern="[0-9]{10}" required>
              <div class="invalid-feedback">Enter a valid 10-digit number.</div>
            </div>
          </div>

          <!-- Gender -->
          <div class="mb-3">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male" value="Male" required>
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
              <label class="form-check-label" for="female">Female</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="other" value="Other">
              <label class="form-check-label" for="other">Other</label>
            </div>
          </div>

          <!-- Date & Time Slot -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="darshanDate" class="form-label">Darshan Date</label>
              <input type="date" class="form-control" id="darshanDate" required>
            </div>
            <div class="col-md-6">
              <label for="timeSlot" class="form-label">Darshan Time Slot</label>
              <select class="form-select" id="timeSlot" required>
                <option value="">Select</option>
                <option>Morning</option>
                <option>Afternoon</option>
                <option>Evening</option>
              </select>
            </div>
          </div>

          <!-- Tickets -->
          <div class="mb-3">
            <label for="tickets" class="form-label">Number of Tickets</label>
            <input type="number" class="form-control" id="tickets" min="1" max="10" value="1" required>
          </div>

          <!-- Seva Type -->
          <div class="mb-3">
            <label class="form-label">Seva Type</label>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="archana">
              <label class="form-check-label" for="archana">Archana</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="abhishekam">
              <label class="form-check-label" for="abhishekam">Abhishekam</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="specialEntry">
              <label class="form-check-label" for="specialEntry">Special Entry Darshan</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="suprabhata">
              <label class="form-check-label" for="suprabhata">Suprabhata Seva</label>
            </div>
          </div>

          <!-- ID Proof -->
          <div class="mb-3">
            <label for="idProof" class="form-label">ID Proof Upload 
              <i class="bi bi-info-circle" data-bs-toggle="tooltip" data-bs-placement="top" title="Accepted formats: JPG, PNG, PDF"></i>
            </label>
            <input type="file" class="form-control" id="idProof" accept=".jpg,.jpeg,.png,.pdf" required>
            <div class="invalid-feedback">Please upload your ID proof.</div>
          </div>

          <!-- Address -->
          <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" id="address" rows="2" required></textarea>
          </div>

          <!-- Buttons -->
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center">
        <h5 class="mb-3">Your Tirupati Darshan Booking is Confirmed!</h5>
        <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Enable tooltips
  var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
  tooltipTriggerList.map(function (tooltipTriggerEl) {
    return new bootstrap.Tooltip(tooltipTriggerEl)
  });

  // Form validation
  (function () {
    'use strict'
    var form = document.getElementById('bookingForm')
    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      } else {
        event.preventDefault()
        var modal = new bootstrap.Modal(document.getElementById('confirmModal'))
        modal.show()
      }
      form.classList.add('was-validated')
    }, false)
  })();
</script>
</body>
</html>
