<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furniture Store Catalog</title>
<style>
    body {
        background-color: #f8f9fc;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
    }
    header {
        text-align: center;
        margin-top: 30px;
    }
    header h1 {
        font-size: 2em;
        color: #222;
    }
    header p {
        color: #555;
        margin-top: 5px;
    }
    .products {
        display: flex;
        gap: 20px;
        margin-top: 30px;
    }
    .card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        width: 220px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card img {
        width: 100%;
        height: auto;
        border-radius: 5px;
    }
    .card h3 {
        margin: 15px 0 5px;
    }
    .card p {
        color: #666;
        font-size: 0.9em;
        margin-bottom: 10px;
    }
    .price {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #000;
    }
    .btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
    }
    .btn:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>

<header>
    <h1>Furniture Store Catalog</h1>
    <p>Find the best furniture for your home</p>
</header>

<section class="products">
    <!-- Sofa Card -->
    <div class="card" style="background-color: #fefefe;">
        <img src="sofa.jpg" alt="Sofa">
        <h3>Sofa</h3>
        <p>Comfortable and stylish sofa</p>
        <div class="price">$499</div>
        <button class="btn">Buy Now</button>
    </div>

    <!-- Dining Table Card (Inline text color change) -->
    <div class="card">
        <img src="table.jpg" alt="Dining Table">
        <h3 style="color: brown;">Dining Table</h3>
        <p>Wooden dining table</p>
        <div class="price">$299</div>
        <button class="btn">Buy Now</button>
    </div>

    <!-- Chair Card (Inline button style change) -->
    <div class="card">
        <img src="chair.jpg" alt="Chair">
        <h3>Chair</h3>
        <p>Modern chair for any room</p>
        <div class="price">$149</div>
        <button class="btn" style="background-color: black;">Buy Now</button>
    </div>
</section>

</body>
</html>
