<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration Result</title>
</head>
<body>
<h2>Registration Details</h2>
<ul>
    <li>User Name: <span th:text="${username}"></span></li>
    <li>Password: <span th:text="${password}"></span></li>
    <li>Email: <span th:text="${email}"></span></li>
    <li>Birthday: <span th:text="${birthday}"></span></li>
    <li>Profession: <span th:text="${profession}"></span></li>
</ul>
</body>
</html>
