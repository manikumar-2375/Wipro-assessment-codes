<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Client</title>
</head>
<body>
<h2 th:text="${client.id} == null ? 'Add New Client' : 'Update Client'"></h2>
<form th:action="@{/saveClient}" th:object="${client}" method="post">
    <input type="hidden" th:field="*{id}" />
    
    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br/>
    
    <label>Email:</label>
    <input type="email" th:field="*{email}" required /><br/>
    
    <label>Phone:</label>
    <input type="text" th:field="*{phone}" required /><br/>
    
    <label>Address:</label>
    <input type="text" th:field="*{address}" required /><br/>

    <button type="submit">Save</button>
</form>
<a th:href="@{/}">Back to List</a>
</body>
</html>
